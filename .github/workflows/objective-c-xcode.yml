name: Build Unsigned tvOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      # ── 1. Archive（跳过签名）─────────────────────────────────────
      - name: Archive without signing
        run: |
          xcodebuild archive \
            -project NeteaseTVDemo.xcodeproj \
            -scheme MyApptvOS \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -configuration Release \
            -archivePath $RUNNER_TEMP/MyApp.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      # ── 2. 手动打包成 IPA ─────────────────────────────────────────
      - name: Package IPA manually
        run: |
          # 找到 .app bundle
          APP_PATH=$(find $RUNNER_TEMP/MyApp.xcarchive \
            -name "*.app" -maxdepth 5 | head -1)
          echo "App path: $APP_PATH"

          # 按 IPA 标准结构打包
          mkdir -p $RUNNER_TEMP/Payload
          cp -r "$APP_PATH" $RUNNER_TEMP/Payload/

          cd $RUNNER_TEMP
          zip -r MyApp-unsigned.ipa Payload/

      # ── 3. 上传 Artifact ──────────────────────────────────────────
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-tvOS-unsigned
          path: ${{ runner.temp }}/MyApp-unsigned.ipa
          retention-days: 7
